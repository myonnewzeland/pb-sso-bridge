[project]
name = "pb-sso-bridge"
version = "0.1.0"
description = "OAuth2/OIDC bridge between corporate SSO and PocketBase"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.118.2",
    "uvicorn[standard]>=0.34.0",
    "python-dotenv>=1.0.1",
    "PyJWT>=2.10.1",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
